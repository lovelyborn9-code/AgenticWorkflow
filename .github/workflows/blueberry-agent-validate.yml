name: Blueberry Agent Validation

on:
  pull_request:
    paths:
      - .codex/skills/blueberry-agent/**
      - integrations/blueberry-agent/**
      - docs/blueberry-agent-stack.md
      - mcp/**
      - .github/workflows/blueberry-agent-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill frontmatter
        shell: bash
        run: |
          test -s .codex/skills/blueberry-agent/SKILL.md
          grep -q '^name: blueberry-agent$' .codex/skills/blueberry-agent/SKILL.md
          grep -q '^description:' .codex/skills/blueberry-agent/SKILL.md
      - name: Check for committed secrets
        shell: bash
        run: |
          ! grep -RInE 'BAND_ACCESS_TOKEN|refresh_token|client_secret' .codex integrations docs mcp .github/workflows
      - name: Validate Python MCP syntax when present
        shell: bash
        run: |
          if find mcp -name '*.py' -print -quit | grep -q .; then python -m compileall -q mcp; fi
